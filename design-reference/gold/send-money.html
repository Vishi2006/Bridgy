<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Pesse Gold - Send Money</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        gold: '#C9A961',
        goldDeep: '#A9863D',
        goldText: '#8A6A2A',
        ivory: '#F4F1EA',
        ink: '#171513',
        muted: '#8A8578',
        line: '#E7E1D4',
        dark: '#141312',
      },
      fontFamily: {
        display: ['Fraunces', 'serif'],
        sans: ['Manrope', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace'],
      }
    }
  }
}
</script>
<style>
  .keypad-btn:active { transform: scale(0.96); opacity: 0.85; }
  @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .animate-blink { animation: cursor-blink 1.05s infinite; }
</style>
</head>
<body class="bg-[#E4DFD4] min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans select-none antialiased text-ink">
<main class="w-full max-w-[390px] h-[844px] bg-ivory rounded-[48px] shadow-2xl overflow-hidden flex flex-col justify-between relative border-[7px] border-white/70">
  <div class="flex flex-col w-full px-5 pt-8">
    <header class="flex items-center justify-between py-2 mb-4">
      <button aria-label="Go back" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-ink shadow-sm active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
      </button>
      <h1 class="text-base font-semibold text-ink tracking-tight">Send money</h1>
      <button aria-label="Help and Info" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-ink shadow-sm active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </button>
    </header>

    <section class="bg-white rounded-3xl p-4 shadow-sm">
      <p class="text-xs font-semibold text-ink mb-3 tracking-wide">Send to</p>
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="relative w-11 h-11">
            <img src="../../assets/images/avatars/syaiful_send.jpg" alt="Syaiful Rijal" class="w-11 h-11 rounded-full object-cover border border-line">
            <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-white rounded-full flex items-center justify-center p-[1px] shadow">
              <span class="w-full h-full rounded-full bg-gradient-to-tr from-brick to-[#4A4A9E] block"></span>
            </span>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-ink leading-tight">Syaiful Rijal</h2>
            <p class="text-xs text-muted mt-0.5 font-medium">8921362190</p>
          </div>
        </div>
        <button class="px-3.5 py-1.5 rounded-full bg-[#EEEAE0] text-xs font-medium text-ink">Change</button>
      </div>
    </section>

    <section class="flex items-center justify-center py-8">
      <div class="flex items-center justify-center tracking-tight">
        <span class="text-[60px] font-display font-bold text-ink leading-none tracking-[-0.03em]">$19</span>
        <span class="w-[3.5px] h-12 bg-gold rounded-full ml-1.5 animate-blink"></span>
      </div>
    </section>

    <section class="bg-white rounded-2xl p-3 px-4 shadow-sm flex items-center justify-between mb-4">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-7 bg-gold rounded-[6px] p-1 flex flex-col justify-between shadow-sm relative overflow-hidden">
          <div class="flex justify-between items-center text-[5px] text-ink font-bold tracking-tighter">
            <span class="uppercase">Linda</span><span class="italic font-black text-[6px]">VISA</span>
          </div>
          <div class="text-[5px] font-semibold text-ink tracking-wider">•••• 2451</div>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-ink leading-snug">Linda’s card</h3>
          <p class="text-[11px] text-muted font-medium">Balance <span class="font-semibold text-ink">$521,098.31</span></p>
        </div>
      </div>
      <button class="px-3.5 py-1.5 rounded-full bg-[#EEEAE0] text-xs font-medium text-ink">Change</button>
    </section>
  </div>

  <div class="w-full px-5 pb-7 flex flex-col gap-3">
    <div aria-label="Numeric keypad" class="grid grid-cols-3 gap-2">
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">1</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">2</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">3</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">4</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">5</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">6</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">7</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">8</button>
      <button class="keypad-btn h-12 bg-gold rounded-2xl font-bold text-lg text-ink flex items-center justify-center shadow-sm">9</button>
      <button class="keypad-btn h-12 bg-white/70 rounded-2xl font-semibold text-sm text-ink flex items-center justify-center shadow-sm">000</button>
      <button class="keypad-btn h-12 bg-white rounded-2xl font-semibold text-lg text-ink flex items-center justify-center shadow-sm">0</button>
      <button aria-label="Backspace" class="keypad-btn h-12 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm">
        <svg class="w-5 h-5 text-ink" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M2.5 12a2 2 0 0 1 .586-1.414l5-5A2 2 0 0 1 9.5 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-10a2 2 0 0 1-1.414-.586l-5-5A2 2 0 0 1 2.5 12Zm11.707-2.707a1 1 0 0 0-1.414 1.414L14.086 12l-1.293 1.293a1 1 0 1 0 1.414 1.414L15.5 13.414l1.293 1.293a1 1 0 0 0 1.414-1.414L16.914 12l1.293-1.293a1 1 0 0 0-1.414-1.414L15.5 10.586l-1.293-1.293Z" fill-rule="evenodd"></path></svg>
      </button>
    </div>
    <button class="w-full h-14 bg-[#0D0C0B] text-white font-medium text-base rounded-full shadow-lg flex items-center justify-center transition-all mt-1 active:scale-[0.99]">
      Send money
    </button>
    <div class="w-32 h-1 bg-ink/20 rounded-full mx-auto mt-1"></div>
  </div>
</main>
</body>
</html>
